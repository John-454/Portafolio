{
  '$schema': 'https://json.schemastore.org/dependabot-v2.json',
  'version': 2,
  'updates':
    [
      {
        'package-ecosystem': 'npm',
        'directory': '/',
        'schedule':
          { 'interval': 'weekly', 'day': 'monday', 'time': '09:00', 'timezone': 'America/Bogota' },
        'open-pull-requests-limit': 10,
        'reviewers': ['John-454'],
        'labels': ['dependencies', 'npm'],
        'commit-message': { 'prefix': 'chore(deps):', 'include': 'scope' },
        'groups': { 'dev-dependencies': { 'patterns': ['*'], 'dependency-type': 'development' } },
      },
      {
        'package-ecosystem': 'github-actions',
        'directory': '/',
        'schedule':
          { 'interval': 'weekly', 'day': 'monday', 'time': '09:00', 'timezone': 'America/Bogota' },
        'labels': ['dependencies', 'github-actions'],
      },
    ],
}
